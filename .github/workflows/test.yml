name: Cargo Test 

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Rust project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install latest stable
        uses: actions-rs/toolchain@v1
        with:
            toolchain: stable
            override: true

      - name: Cargo Test
        run: cargo test 

