[package]
name = "airborne"
version = "0.1.0"
edition = "2024"
authors = ["Abhinandh S <abhinandhsuby@proton.me>"]
description = "A heavily-typed, generic Rust statistics and finance library."
categories = []
keywords    = ["statistics", "math", "generics", "sample", "population", "finance", "risk", "capital"]
homepage = "https://github.com/abhinandh-s/airborne"
repository = "https://github.com/abhinandh-s/airborne"
readme = "README.md"
license = "MIT"
license_file = "LICENSE"

[badges]
maintenance = { status = "actively-developed" }

[features]
default = []
# default = ["precision"]
# Switch the internal arithmetic backend from f64 to rust_decimal.
# All public return types remain f64 - only internal precision changes.
# Requires rust_decimal's `maths` sub-feature for sqrt, ln, exp, pow.
precision = ["dep:rust_decimal"]

[dependencies]
num-traits = "0.2"
thiserror  = "2.0"

[dependencies.rust_decimal]
version  = "1"
optional = true
features = ["maths"]

[dev-dependencies]
approx = "0.5"
