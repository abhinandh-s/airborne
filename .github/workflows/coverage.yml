name: Coverage Badge

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Required to allow the action to commit the badge back to the repo
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Run Tarpaulin
        id: tarpaulin
        run: |
          # Install tarpaulin (using the binary for speed)
          cargo install cargo-tarpaulin
          # Run it and capture the percentage
          # We use grep/sed to pull just the numerical value from the output
          COVERAGE=$(cargo tarpaulin --out stdout | grep -oP '\d+\.\d+(?=% coverage)' | head -n 1)
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Generate coverage badge
        uses: ozankasikci/rust-test-coverage-badge@v1
        with:
          coverage: ${{ steps.tarpaulin.outputs.percentage }}
          output: assets/coverage.svg
          commit: true
