name: Cargo Test 

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, beta, nightly]         

    steps:
    - uses: actions/checkout@v5

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        # sudo apt-get install -y pkg-config

    - name: Build
      run: cargo build --verbose

    - name: Cargo Test (no precision flag)
      run: cargo test 

    - name: Cargo Test (with precision features flag)
      run: cargo test -F precision

    - name: Clippy
      run: cargo clippy -- -D warnings
