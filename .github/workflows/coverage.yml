name: Coverage Badge

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Required to allow the action to commit the badge back to the repo
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Tarpaulin
        run: |
          # Download the musl binary directly to cargo bin
          curl -sL https://github.com/xd009642/tarpaulin/releases/latest/download/cargo-tarpaulin-x86_64-unknown-linux-musl.tar.gz | tar zxvf - -C /home/runner/.cargo/bin

      - name: Run Tarpaulin
        id: tarpaulin
        run: |
          # Use --ignore-panics and --engine llvm for better speed/reliability in CI
          cargo tarpaulin --out stdout > tarpaulin_out.txt
          cat tarpaulin_out.txt
          
          # Improved regex to handle cases where tarpaulin output varies
          COVERAGE=$(grep -oP '\d+(\.\d+)?(?=% coverage)' tarpaulin_out.txt | head -n 1)
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
