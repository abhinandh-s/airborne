name: Publish Docs

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Build docs
        env:
          # -D warnings ensures your CI fails if there are doc errors
          # --generate-link-to-definition makes the source code interactive
          RUSTDOCFLAGS: "-D warnings --generate-link-to-definition"
        run: cargo doc --no-deps --all-features

      # - name: Build docs
      #   run: cargo doc --no-deps

      - name: Create redirect index
        run: echo '<meta http-equiv="refresh" content="0;url=airborne/index.html">' > target/doc/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
