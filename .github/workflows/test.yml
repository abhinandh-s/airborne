name: Cargo Test 

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Rust project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install latest stable
        uses: actions-rs/toolchain@v1
        with:
            toolchain: stable
            override: true

      - name: Cargo Test (no precision flag)
        run: cargo test 

      - name: Cargo Test (with precision features flag)
        run: cargo test cargo t -F precision
